<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Sin conexión — LEXO</title>
  <link rel="stylesheet" href="/assets/css/lexo.css">
</head>
<body style="align-items:center;justify-content:center;padding:24px;text-align:center;">
  <main class="lx-card" style="max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;">
    <div class="lx-tiles-row" aria-hidden="true">
      <span class="lx-tile lx-tile-l">L</span>
      <span class="lx-tile lx-tile-e">E</span>
      <span class="lx-tile lx-tile-x">X</span>
      <span class="lx-tile lx-tile-o">O</span>
    </div>
    <h1 style="margin:0;font-size:1.5rem;font-weight:900;">Sin conexión a internet</h1>
    <p class="lx-hint" style="margin:0;">
      Para sincronizar el reloj de la sala y registrar palabras en vivo necesitás estar conectado.
    </p>
    <button type="button" onclick="window.location.reload()" class="lx-btn lx-btn-coral lx-btn-block">
      ↻ Reintentar conexión
    </button>
  </main>
</body>
</html>
